# Intestazioni di sicurezza, su ogni risposta (anche di errore, grazie ad «always»).
# Incluse nel server e in ogni location che ha un add_header proprio: in nginx una
# location con un suo add_header non eredita quelli del server.
#
# CSP: script, stili, connessioni, manifest e service worker solo dalla stessa origine;
# immagini solo locali (niente richieste verso altri siti), niente audio/video né plugin;
# la pagina non si incornicia in altri siti. 'unsafe-inline' per gli stili serve a Svelte.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'none'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
